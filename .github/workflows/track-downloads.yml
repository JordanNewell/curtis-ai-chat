name: Track downloads

# Weekly snapshot of marketplace downloads for curtis-ai-chat.
# scripts/fetch-plugin-stats.mjs fetches Obsidian's official plugin stats
# (community-plugin-stats.json) and appends one row to docs/metrics/downloads.csv;
# this workflow commits the CSV back to the default branch (master).
# Re-runs are idempotent per UTC day (the script skips an already-recorded date),
# and the commit step exits early when there is no diff, so the loop stays finite.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-downloads
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Fetch plugin stats
        run: node scripts/fetch-plugin-stats.mjs

      - name: Commit snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/
          if git diff --cached --quiet; then
            echo "No new snapshot data — nothing to commit"
            exit 0
          fi
          git commit -m "chore(metrics): weekly download snapshot"
          git push
