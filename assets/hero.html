<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curtis AI Chat — hero</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 800px; overflow: hidden; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: 480px 1fr;
    align-items: center;
    padding: 0 120px;
    gap: 96px;
  }
  .mark {
    width: 420px;
    height: 420px;
    display: block;
  }
  .content { max-width: 880px; }
  .wordmark {
    font-size: 112px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 0.95;
    color: #FFFFFF;
    margin-bottom: 24px;
  }
  .wordmark .dot { color: #00FF41; }
  .tagline {
    font-size: 28px;
    line-height: 1.5;
    color: #A0A0A0;
    max-width: 720px;
    margin-bottom: 40px;
    font-weight: 400;
  }
  .tagline strong { color: #FFFFFF; font-weight: 500; }
  .chips {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .chip {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 16px;
    font-weight: 500;
    padding: 10px 20px;
    border: 1px solid #1F1F1F;
    color: #FFFFFF;
    letter-spacing: 0.04em;
  }
  .chip.accent {
    border-color: #00FF41;
    color: #00FF41;
  }
</style>
</head>
<body>
  <img class="mark" src="curtis-ai-mark.png" alt="Curtis AI">
  <div class="content">
    <h1 class="wordmark">Curtis AI Chat</h1>
    <p class="tagline"><strong>Polyglot AI chat for Obsidian.</strong> Thirty-plus providers, one sidebar. Your data stays in your vault.</p>
    <div class="chips">
      <span class="chip accent">30+ providers</span>
      <span class="chip">agent · arena · voice</span>
      <span class="chip">local-first</span>
    </div>
  </div>
</body>
</html>
